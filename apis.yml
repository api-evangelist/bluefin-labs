name: Bluefin Labs
description: 'Bluefin Labs was a social TV analytics company founded in 2008 in Cambridge, Massachusetts
  by Deb Roy and Michael Fleischman, spun out of research at the MIT Media Lab. Its platform semantically
  interpreted public social media commentary from Twitter, Facebook and blogs and automatically linked
  those comments to the television shows and advertisements people were watching, producing audience
  engagement measurement for networks, agencies and brands. Its product, Bluefin Signals, gave media
  buyers a tool for accessing and analyzing social TV response data. The company raised a Series A led
  by Redpoint Ventures in 2010 and a $12M Series B led by Time Warner Investments in January 2012, with
  SoftBank Capital and Lerer Ventures participating. Twitter acquired Bluefin Labs on February 6, 2013
  for a reported ~$100 million and absorbed the team and technology into its TV advertising and analytics
  products. The company is DEFUNCT: it operates no independent product, developer program or API, and
  the bluefinlabs.com domain no longer belongs to the company — it now redirects to an unrelated news
  site. This profile is retained as a historical / portfolio-graph record only.'
